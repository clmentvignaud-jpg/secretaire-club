<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secrétaire Club</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .carte {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-top: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .nom {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .ligne {
      margin: 8px 0;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .attention {
      color: #c62828;
      font-weight: bold;
    }

    #message {
      text-align: center;
      color: #666;
      margin-top: 20px;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🥋 Secrétaire Club</h1>
</header>

<main>

  <input
    type="text"
    id="recherche"
    placeholder="Rechercher un adhérent..."
    autocomplete="off"
  >

  <div id="resultats"></div>

  <div id="message"></div>

</main>

<iframe id="pont"></iframe>

<script>

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyLqvBlajcoTwyQL2SM5q1J7TcH4Zo8JidR78BkA-F9Gi4RsPuGaQh1tEwxmJla4ztM/exec";

  const recherche =
    document.getElementById("recherche");

  const resultats =
    document.getElementById("resultats");

  const message =
    document.getElementById("message");

  const pont =
    document.getElementById("pont");


  function afficherAdherents(donnees) {

    resultats.innerHTML = "";

    if (!donnees || donnees.length === 0) {
      message.textContent = "Aucun adhérent trouvé.";
      return;
    }

    message.textContent = "";

    donnees.forEach(function(adherent) {

      const carte =
        document.createElement("div");

      carte.className = "carte";

      let paiement = "";

      if (adherent.aRegler > 0) {
        paiement =
          '<div class="ligne attention">🔴 ' +
          adherent.aRegler +
          ' € à régler</div>';
      } else {
        paiement =
          '<div class="ligne ok">🟢 Cotisation à jour</div>';
      }

      carte.innerHTML =
        '<div class="nom">' +
        adherent.prenom + " " +
        adherent.nom +
        '</div>' +

        paiement +

        '<div class="ligne">💰 Réglé : ' +
        adherent.regle +
        ' €</div>' +

        '<div class="ligne">🩺 Certificat : ' +
        (adherent.certif || "—") +
        '</div>' +

        '<div class="ligne">📄 Licence : ' +
        (adherent.licence || "—") +
        '</div>' +

        '<div class="ligne">📞 ' +
        (adherent.telephone || "—") +
        '</div>' +

        '<div class="ligne">✉️ ' +
        (adherent.email || "—") +
        '</div>' +

        '<div class="ligne">🥋 Salle : ' +
        (adherent.salle || "—") +
        '</div>';

      resultats.appendChild(carte);
    });
  }


  window.addEventListener("message", function(event) {

    if (
      event.data &&
      event.data.type ===
      "reponseSecretaireClub"
    ) {

      afficherAdherents(
        event.data.donnees
      );
    }

  });


  let timer = null;


  recherche.addEventListener("input", function() {

    clearTimeout(timer);

    const texte =
      recherche.value.trim();

    if (!texte) {
      resultats.innerHTML = "";
      message.textContent = "";
      return;
    }

    message.textContent =
      "Recherche…";

    timer = setTimeout(function() {

      pont.src =
        API_URL +
        "?api=bridge" +
        "&recherche=" +
        encodeURIComponent(texte) +
        "&t=" +
        Date.now();

    }, 300);

  });

</script>

</body>
</html>
