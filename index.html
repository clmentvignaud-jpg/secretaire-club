<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secrétaire Club</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 14px;
      font-size: 17px;
      background: white;
    }

    #resultats {
      margin-top: 20px;
    }

    .message {
      text-align: center;
      color: #666;
      padding: 25px 10px;
    }

    .carte {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .nom {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .ligne {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .ok {
      color: green;
      font-weight: bold;
    }

    .alerte {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🥋 Secrétaire Club</h1>
  <p>Gestion des adhérents</p>
</header>

<main>

  <input
    id="recherche"
    type="search"
    placeholder="🔎 Rechercher un adhérent"
  >

  <div id="resultats">
    <div class="message">
      Tape un prénom ou un nom.
    </div>
  </div>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyLqvBlajcoTwyQL2SM5q1J7TcH4Zo8JidR78BkA-F9Gi4RsPuGaQh1tEwxmJla4ztM/exec";

const recherche = document.getElementById("recherche");
const resultats = document.getElementById("resultats");

recherche.addEventListener("input", function() {

  const texte = recherche.value.trim();

  if (!texte) {
    resultats.innerHTML =
      '<div class="message">Tape un prénom ou un nom.</div>';
    return;
  }

  resultats.innerHTML =
    '<div class="message">🔎 Recherche...</div>';

  const callback =
    "callback_" + Date.now();

  window[callback] = function(data) {

    delete window[callback];

    afficher(data);
  };

  const script =
    document.createElement("script");

  script.src =
    API_URL +
    "?api=rechercher" +
    "&recherche=" +
    encodeURIComponent(texte) +
    "&callback=" +
    callback;

  document.body.appendChild(script);

});


function afficher(data) {

  if (!data || data.length === 0) {

    resultats.innerHTML =
      '<div class="message">Aucun adhérent trouvé.</div>';

    return;
  }

  resultats.innerHTML = "";

  data.forEach(function(adherent) {

    const carte =
      document.createElement("div");

    carte.className = "carte";

    let statut = "";

    if (Number(adherent.aRegler) > 0) {

      statut =
        '<div class="alerte">🔴 ' +
        Number(adherent.aRegler).toFixed(2) +
        ' € à régler</div>';

    } else {

      statut =
        '<div class="ok">🟢 Cotisation à jour</div>';
    }

    carte.innerHTML =

      '<div class="nom">' +
      adherent.prenom +
      ' ' +
      adherent.nom +
      '</div>' +

      statut +

      '<div class="ligne">💶 Tarif : ' +
      Number(adherent.tarif).toFixed(2) +
      ' €</div>' +

      '<div class="ligne">✅ Réglé : ' +
      Number(adherent.regle).toFixed(2) +
      ' €</div>' +

      '<div class="ligne">📄 Certificat : ' +
      (adherent.certif || "—") +
      '</div>' +

      '<div class="ligne">🪪 Licence : ' +
      (adherent.licence || "—") +
      '</div>' +

      '<div class="ligne">📧 Email : ' +
      (adherent.email || "—") +
      '</div>' +

      '<div class="ligne">📞 Téléphone : ' +
      (adherent.telephone || "—") +
      '</div>' +

      '<div class="ligne">🏫 Salle : ' +
      (adherent.salle || "—") +
      '</div>';

    resultats.appendChild(carte);

  });
}

</script>

</body>
</html>
