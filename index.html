<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secrétaire Club</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.8;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    #recherche {
      width: 100%;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 17px;
      background: white;
    }

    #resultats {
      margin-top: 20px;
    }

    .message {
      text-align: center;
      padding: 25px 10px;
      color: #6b7280;
    }

    .carte {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .nom {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .statut {
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .ok {
      background: #dcfce7;
      color: #166534;
    }

    .alerte {
      background: #fee2e2;
      color: #991b1b;
    }

    .ligne {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .ligne:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🥋 Secrétaire Club</h1>
  <p>Gestion des adhérents</p>
</header>

<main>

  <input
    id="recherche"
    type="search"
    placeholder="🔎 Rechercher un adhérent"
    autocomplete="off"
  >

  <div id="resultats">
    <div class="message">
      Tape un prénom ou un nom pour rechercher.
    </div>
  </div>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyLqvBlajcoTwyQL2SM5q1J7TcH4Zo8JidR78BkA-F9Gi4RsPuGaQh1tEwxmJla4ztM/exec";

const champ =
document.getElementById("recherche");

const zone =
document.getElementById("resultats");


champ.addEventListener("input", function() {

  const texte =
    champ.value.trim();

  if (!texte) {

    zone.innerHTML =
      '<div class="message">' +
      'Tape un prénom ou un nom pour rechercher.' +
      '</div>';

    return;
  }

  zone.innerHTML =
    '<div class="message">🔎 Recherche...</div>';


  const nomCallback =
    "callbackRecherche";


  window[nomCallback] =
    function(donnees) {

      console.log("Réponse reçue :", donnees);

      zone.innerHTML = "";


      if (!donnees || donnees.length === 0) {

        zone.innerHTML =
          '<div class="message">' +
          'Aucun adhérent trouvé.' +
          '</div>';

        return;
      }


      donnees.forEach(function(adherent) {

        const carte =
          document.createElement("div");

        carte.className = "carte";


        let statut;

        if (Number(adherent.aRegler) > 0) {

          statut =
            '<div class="statut alerte">' +
            '🔴 ' +
            Number(adherent.aRegler).toFixed(2) +
            ' € à régler' +
            '</div>';

        } else {

          statut =
            '<div class="statut ok">' +
            '🟢 Cotisation à jour' +
            '</div>';
        }


        carte.innerHTML =

          '<div class="nom">' +
          adherent.prenom +
          ' ' +
          adherent.nom +
          '</div>' +

          statut +

          '<div class="ligne">💶 Tarif : ' +
          Number(adherent.tarif || 0).toFixed(2) +
          ' €</div>' +

          '<div class="ligne">✅ Réglé : ' +
          Number(adherent.regle || 0).toFixed(2) +
          ' €</div>' +

          '<div class="ligne">📄 Certificat : ' +
          (adherent.certif || "—") +
          '</div>' +

          '<div class="ligne">🪪 Licence : ' +
          (adherent.licence || "—") +
          '</div>' +

          '<div class="ligne">📧 Email : ' +
          (adherent.email || "—") +
          '</div>' +

          '<div class="ligne">📞 Téléphone : ' +
          (adherent.telephone || "—") +
          '</div>' +

          '<div class="ligne">🏫 Salle : ' +
          (adherent.salle || "—") +
          '</div>';


        zone.appendChild(carte);

      });

    };


  const ancien =
    document.getElementById("scriptRecherche");

  if (ancien) {
    ancien.remove();
  }


  const script =
    document.createElement("script");

  script.id =
    "scriptRecherche";


  script.src =
    API_URL +
    "?api=rechercher" +
    "&recherche=" +
    encodeURIComponent(texte) +
    "&callback=" +
    nomCallback +
    "&t=" +
    Date.now();


  document.body.appendChild(script);

});

</script>

</body>
</html>
