<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#111827">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Secrétaire Club</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #f3f4f6;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f4f6;
      color: #111827;

      -webkit-text-size-adjust: 100%;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100dvh;

      margin: 0 auto;

      display: flex;
      flex-direction: column;
    }


    /* =========================
       EN-TÊTE
       ========================= */

    .header {

      width: 100%;

      padding:
        calc(env(safe-area-inset-top) + 18px)
        18px
        18px;

      background: #111827;
      color: white;
    }

    .header-title {
      font-size: 23px;
      font-weight: 700;
      line-height: 1.2;
    }

    .header-subtitle {
      margin-top: 5px;

      font-size: 14px;

      color: #d1d5db;
    }


    /* =========================
       RECHERCHE
       ========================= */

    .search-area {

      width: 100%;

      padding: 14px;

      background: #f3f4f6;
    }

    .search {

      width: 100%;
      height: 56px;

      padding:
        0
        16px;

      border: 0;
      border-radius: 16px;

      outline: none;

      background: white;

      font-size: 17px;

      box-shadow:
        0 2px 8px rgba(0,0,0,.08);

      -webkit-appearance: none;
    }

    .search::placeholder {
      color: #9ca3af;
    }


    /* =========================
       CONTENU
       ========================= */

    #content {

      width: 100%;

      padding:
        0
        14px
        calc(30px + env(safe-area-inset-bottom));
    }


    /* =========================
       ACCUEIL
       ========================= */

    .welcome {

      width: 100%;

      margin-top: 10px;

      padding: 30px 20px;

      border-radius: 20px;

      background: white;

      text-align: center;

      box-shadow:
        0 2px 8px rgba(0,0,0,.06);
    }

    .welcome-icon {
      font-size: 42px;
    }

    .welcome-title {

      margin-top: 12px;

      font-size: 20px;
      font-weight: 700;
    }

    .welcome-text {

      margin-top: 8px;

      color: #6b7280;

      font-size: 15px;

      line-height: 1.5;
    }


    /* =========================
       CARTE
       ========================= */

    .card {

      width: 100%;

      margin-top: 10px;

      padding: 17px;

      background: white;

      border-radius: 20px;

      box-shadow:
        0 2px 10px rgba(0,0,0,.07);

      overflow: hidden;
    }

    .name {

      font-size: 22px;
      font-weight: 700;

      line-height: 1.25;

      overflow-wrap: anywhere;
    }


    /* =========================
       STATUT
       ========================= */

    .status {

      width: 100%;

      margin-top: 12px;

      padding: 13px;

      border-radius: 14px;

      text-align: center;

      font-size: 15px;
      font-weight: 700;
    }

    .status.ok {

      background: #dcfce7;

      color: #166534;
    }

    .status.late {

      background: #fee2e2;

      color: #991b1b;
    }


    /* =========================
       FINANCES
       ========================= */

    .finance {

      width: 100%;

      margin-top: 14px;

      padding: 13px;

      border-radius: 14px;

      background: #f9fafb;
    }

    .finance-row {

      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 12px;

      min-height: 32px;

      font-size: 15px;
    }

    .finance-row span:first-child {

      color: #6b7280;
    }

    .finance-row span:last-child {

      font-weight: 700;

      white-space: nowrap;
    }


    /* =========================
       INFORMATIONS
       ========================= */

    .infos {

      margin-top: 12px;
    }

    .info {

      padding: 9px 0;

      border-bottom:
        1px solid #eeeeee;
    }

    .info:last-child {
      border-bottom: 0;
    }

    .info-label {

      font-size: 11px;

      font-weight: 700;

      color: #9ca3af;

      text-transform: uppercase;
    }

    .info-value {

      margin-top: 3px;

      font-size: 15px;

      line-height: 1.4;

      overflow-wrap: anywhere;
    }


    /* =========================
       RÈGLEMENT
       ========================= */

    .payment {

      margin-top: 13px;

      padding-top: 14px;

      border-top:
        1px solid #eeeeee;
    }

    .payment-title {

      margin-bottom: 9px;

      font-size: 16px;

      font-weight: 700;
    }

    .amount {

      width: 100%;
      height: 52px;

      padding: 0 14px;

      border:
        1px solid #d1d5db;

      border-radius: 13px;

      background: white;

      font-size: 17px;

      outline: none;
    }

    .button {

      width: 100%;
      height: 52px;

      margin-top: 9px;

      border: 0;
      border-radius: 13px;

      background: #111827;
      color: white;

      font-size: 16px;

      font-weight: 700;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 400px) {

      .header {
        padding-left: 15px;
        padding-right: 15px;
      }

      .search-area {
        padding-left: 10px;
        padding-right: 10px;
      }

      #content {
        padding-left: 10px;
        padding-right: 10px;
      }

      .card {
        padding: 15px;
      }

    }

  </style>

</head>


<body>

  <div class="app">


    <header class="header">

      <div class="header-title">
        🥋 Secrétaire Club
      </div>

      <div class="header-subtitle">
        Gestion des adhérents
      </div>

    </header>


    <section class="search-area">

      <input
        class="search"
        type="search"
        placeholder="🔎  Rechercher un adhérent"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="words"
        spellcheck="false"
      >

    </section>


    <main id="content">

      <div class="welcome">

        <div class="welcome-icon">
          🥋
        </div>

        <div class="welcome-title">
          Bienvenue
        </div>

        <div class="welcome-text">
          Recherche un adhérent par son
          nom ou son prénom.
        </div>

      </div>

    </main>

  </div>

</body>

</html>
